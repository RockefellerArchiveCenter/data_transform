name: Deploy

on:
  push:
    branches:
      - base

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name }}

    env:
      LAMBDA_NAME: data_transform
      LAMBDA_HANDLER_CODE: src/transformers.py
      BASENAME: transformers.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Export secrets to environment variables
        uses: oNaiPs/secrets-to-env-action@v1.7
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Make zip file
        run: |
          rm -rf package
          mkdir -p package/schemas
          cp "${{ env.LAMBDA_HANDLER_CODE }}" "package/${{ env.BASENAME }}"
          cp -R rac_schemas/schemas/. package/schemas/
          cd package
          zip -r "../${{ env.LAMBDA_NAME }}.zip" .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          role-skip-session-tagging: true
          role-duration-seconds: 900

      - name: Upload file to S3
        run: aws s3 cp $LAMBDA_NAME.zip s3://$LAMBDA_BUCKET_NAME/$LAMBDA_NAME.zip

      - name: Deploy lambda package
        run: aws lambda update-function-code
          --function-name arn:aws:lambda:$AWS_REGION:${{ secrets.AWS_ACCOUNT_ID }}:function:$LAMBDA_NAME
          --zip-file fileb://$LAMBDA_NAME.zip
